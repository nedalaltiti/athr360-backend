networks:
  athar360-network:
    driver: bridge
    name: athar360-network

volumes:
  athar360-data:
    name: athar360-data
  postgres-data:
    name: athar360-postgres-data
  athar360-logs-jo:
    name: athar360-logs-jo
  athar360-logs-us:
    name: athar360-logs-us

services:
  
  # Jordan (jo) Instance
  athar360-jo:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
      args:
        APP_INSTANCE: jo
    
    image: athar360:jo-latest
    container_name: athar360-jo
    restart: unless-stopped
    
    ports:
      - "3978:3978"
    
    # env_file:
    #   - .env.jo
    
    environment:
      - APP_INSTANCE=jo
      - HOSTNAME=athar360-jo
      - PYTHONPATH=/app/src
      - HOST=0.0.0.0
      - PORT=3978
      # AWS credentials and configuration
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_DEFAULT_REGION=${AWS_DEFAULT_REGION:-us-west-1}
      - AWS_REGION=${AWS_REGION:-us-west-1}
      # Let .env.jo file handle AWS secret names
      - AWS_DB_SECRET_NAME=${AWS_DB_SECRET_NAME:-chatbot-db-dev-postgres}
      - AWS_GEMINI_SECRET_NAME=${AWS_GEMINI_SECRET_NAME:-genai-gemini-vertex-prod-api}
      # Local development overrides
      - USE_AWS_SECRETS=${USE_AWS_SECRETS:-true}
      - SKIP_DB_INIT=${SKIP_DB_INIT:-false}
    
    volumes:
      - athar360-data:/app/data
      - athar360-logs-jo:/app/logs
    
    healthcheck:
      test: ["CMD", "python", "/app/healthcheck.py"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '1.0'
        reservations:
          memory: 512M
          cpus: '0.25'
    
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        labels: "service=athar360-jo,environment=${DEBUG:-production}"
    
    networks:
      - athar360-network
    
    security_opt:
      - no-new-privileges:true
    
    profiles:
      - jo
      - multi-app
      - development
      - default

  # US Instance
  athar360-us:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
      args:
        APP_INSTANCE: us
    
    image: athar360:us-latest
    container_name: athar360-us
    restart: unless-stopped
    
    ports:
      - "3979:3979"
    
    # env_file:
    #   - .env.us
    
    environment:
      - APP_INSTANCE=us
      - HOSTNAME=athar360-us
      - PYTHONPATH=/app/src
      - HOST=0.0.0.0
      - PORT=3979
      # AWS credentials and configuration
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_REGION=${AWS_REGION:-us-west-1}
      # Let .env.us file handle AWS secret names
      - AWS_DB_SECRET_NAME=${AWS_DB_SECRET_NAME:-chatbot-db-dev-postgres}
      - AWS_GEMINI_SECRET_NAME=${AWS_GEMINI_SECRET_NAME:-genai-gemini-vertex-prod-api}
      # Local development overrides
      - USE_AWS_SECRETS=${USE_AWS_SECRETS:-true}
      - SKIP_DB_INIT=${SKIP_DB_INIT:-false}
    
    volumes:
      - athar360-data:/app/data
      - athar360-logs-us:/app/logs
    
    healthcheck:
      test: ["CMD", "python", "/app/healthcheck.py"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '1.0'
        reservations:
          memory: 512M
          cpus: '0.25'
    
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        labels: "service=athar360-us,environment=${DEBUG:-production}"
    
    networks:
      - athar360-network
    
    security_opt:
      - no-new-privileges:true
    
    profiles:
      - us
      - multi-app
      - development

  # Nginx Reverse Proxy (optional)
  nginx:
    image: nginx:alpine
    container_name: athar360-nginx
    restart: unless-stopped
    
    ports:
      - "80:80"
      - "443:443"
    
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    
    depends_on:
      - athar360-jo
      - athar360-us
    
    networks:
      - athar360-network
    
    profiles:
      - multi-app
      - production