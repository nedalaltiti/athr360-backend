events {
    worker_connections 1024;
}

http {
    # Rate limiting
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=health_limit:10m rate=1r/s;

    # Upstream definitions for different app instances
    upstream compliance_bot {
        server compliance-bot:3978;
        keepalive 32;
    }

    # Security headers
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # Server block for subdomain-based routing
    server {
        listen 443 ssl http2;
        server_name compliance.exequt.com;

        # SSL configuration
        ssl_certificate /etc/nginx/ssl/cert.pem;
        ssl_certificate_key /etc/nginx/ssl/key.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        # Proxy all requests to compliance bot
        location / {
            limit_req zone=api_limit burst=20 nodelay;
            
            proxy_pass http://compliance_bot;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Timeouts for Microsoft Teams
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # Health check endpoint
        location /health {
            limit_req zone=health_limit;
            proxy_pass http://compliance_bot/health;
        }
    }

    # Server block for compliance bot
    server {
        listen 443 ssl http2;
        server_name compliance.exequt.com;

        # SSL configuration (same as above)
        ssl_certificate /etc/nginx/ssl/cert.pem;
        ssl_certificate_key /etc/nginx/ssl/key.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        # Proxy all requests to compliance bot
        location / {
            limit_req zone=api_limit burst=20 nodelay;
            
            proxy_pass http://compliance_bot;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Timeouts for Microsoft Teams
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # Health check endpoint
        location /health {
            limit_req zone=health_limit;
            proxy_pass http://compliance_bot/health;
        }
    }

    # Alternative: Path-based routing on single domain
    server {
        listen 443 ssl http2;
        server_name athr360.com;

        # SSL configuration
        ssl_certificate /etc/nginx/ssl/cert.pem;
        ssl_certificate_key /etc/nginx/ssl/key.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        # compliance bot on /compliance path
        location /compliance/ {
            limit_req zone=api_limit burst=20 nodelay;
            
                rewrite ^/compliance/(.*)$ /$1 break;
            proxy_pass http://compliance_bot;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Original-URI $request_uri;
        }

        # US bot on /us path
        location /us/ {
            limit_req zone=api_limit burst=20 nodelay;
            
            rewrite ^/us/(.*)$ /$1 break;
            proxy_pass http://us_bot;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Original-URI $request_uri;
        }

        # Root health check
        location /health {
            limit_req zone=health_limit;
            default_type application/json;
            return 200 '{"status": "ok", "message": "Multi-app athr360 Bot proxy healthy"}';
        }

        # Default redirect
        location / {
                return 301 https://athr360.exequt.com;
        }
    }

    # HTTP to HTTPS redirect
    server {
        listen 80;
        server_name *.exequt.com;
        return 301 https://$host$request_uri;
    }
} 